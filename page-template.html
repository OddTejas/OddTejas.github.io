<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic document setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Keep this page hidden from search engines while it is a template.
        DELETE this line after copying the template to a real public page.
    -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Browser tab and search-result title: make it unique for every page. -->
    <title>PAGE NAME - OddHouse</title>

    <!-- Usually one clear sentence, roughly 120–160 characters. -->
    <meta name="description" content="WRITE A SHORT DESCRIPTION OF THIS PAGE.">
    <meta name="author" content="Evan Tejas">

    <!-- Colours supported browser chrome to match OddHouse. -->
    <meta name="theme-color" content="#FFFAEF">

    <!--
        The one official URL for this page.
        Replace "page-name/" with the page's real published path.
    -->
    <link rel="canonical" href="https://oddtejas.github.io/page-name/">

    <!-- Open Graph: controls previews on WhatsApp, Discord, LinkedIn, etc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OddHouse">
    <meta property="og:title" content="PAGE NAME - OddHouse">
    <meta property="og:description" content="WRITE A SHORT DESCRIPTION OF THIS PAGE.">
    <meta property="og:url" content="https://oddtejas.github.io/page-name/">

    <!-- Use an absolute URL. A purpose-made 1200 × 630 image is ideal. -->
    <meta property="og:image" content="https://oddtejas.github.io/assets/images/heroImage.webp">
    <meta property="og:image:alt" content="DESCRIBE THE SOCIAL PREVIEW IMAGE.">

    <!-- Twitter/X card: uses the same title, description and preview image. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PAGE NAME - OddHouse">
    <meta name="twitter:description" content="WRITE A SHORT DESCRIPTION OF THIS PAGE.">
    <meta name="twitter:image" content="https://oddtejas.github.io/assets/images/heroImage.webp">

    <!-- Shared OddHouse styles, followed by an optional page-specific file. -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- <link rel="stylesheet" href="/assets/css/PAGE-NAME.css"> -->

    <!-- OddHouse fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Site identity: the logo always returns to the OddHouse homepage. -->
    <header>
        <a class="logoText" href="/">OddHouse</a>
    </header>

    <main>
        <!--
            Optional full-width hero media goes outside .main so it can reach
            the edges of the viewport. Delete this section when not needed.
        -->
        <section class="hero" aria-label="PAGE NAME introduction">
            <!--
            <img
                id="heroImage"
                src="/assets/images/YOUR-IMAGE.webp"
                alt="DESCRIBE THE HERO IMAGE"
                width="1920"
                height="1080"
                fetchpriority="high"
            >
            -->
        </section>

        <!-- .main supplies the standard OddHouse page margins. -->
        <div class="main">
            <!-- Every page should have one clear primary heading. -->
            <section aria-labelledby="page-title">
                <h1 class="heroText" id="page-title">YOUR PAGE HEADING</h1>
                <p>Write a short introduction explaining what this page contains and why it exists.</p>
            </section>

            <!-- Add, duplicate or remove purposeful content sections below. -->
            <section aria-labelledby="section-title">
                <h2 id="section-title">SECTION HEADING</h2>
                <p>Your section content goes here.</p>
            </section>
        </div>
    </main>

    <!-- footer.js fills this element with the shared OddHouse footer. -->
    <footer id="footer" class="footerGrid"></footer>

    <!-- Shared scripts belong near the end so page content loads first. -->
    <script src="/assets/js/footer.js"></script>
    <!-- <script src="/assets/js/PAGE-NAME.js"></script> -->
</body>

</html>
