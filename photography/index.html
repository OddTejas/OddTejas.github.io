<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Photography - OddHouse">
    <meta property="og:description" content="A personal notebook of photographs curated as quiet rooms to explore.">
    <meta property="og:url" content="https://oddtejas.github.io/photography/">
    <meta property="og:image" content="https://oddtejas.github.io/assets/images/heroPhoto.webp">
    <meta property="og:image:alt" content="A photograph from the OddHouse photography archive">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Photography - OddHouse">
    <meta name="twitter:description" content="A personal notebook of photographs curated as quiet rooms to explore.">
    <meta name="twitter:image" content="https://oddtejas.github.io/assets/images/heroPhoto.webp">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/photography.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
             <a class="logoText" href="../index.html" aria-label="OddHouse home">OddHouse</a>

    </header>
    <main>
        <section class="hero">
            <!--Hero must be outside of main section for proper margin alignment-->
           <img src="../assets/images/heroPhoto.webp" alt="Hero Image" id="heroImage" fetchpriority="high" width="2632" height="1152">
        </section>
        <section class="main">
            <section aria-labelledby="photography-title">
                 <h1 class="heroText" id="photography-title">Place to admire, appreciate and showcase photos</h1>
                 <p>A notebook of photos over the span of half a decade. Watch me, who started no knowledge of this craft and a mobile; progess through and keep learning, keep experimenting and slowly learning my way.</p>
            </section>
            <!--Gallery rooms-->
            <section class="galleryRoom" aria-labelledby="clouds-title">
                <!--Title of rooms and buttions-->
                <header class="roomHeader">
                    <div>
                        <h2 id="clouds-title"></h2>
                        <p id="currentRoom" aria-live="polite"></p>
                    
                    </div>
                    <div id="roomButton">
                        <button id="prevButton" aria-label="Navigation for pervious room">
                            Previous room
                        </button>
                        <button id="nextButton" aria-label="Navigation for Next room">
                            Next room
                        </button>
                    </div>
                </header>
                <!--Div for rooms photos and layout-->
                <div class="roomPhoto" >
                <figure class="roomPhotoItem">
                    <img
                    loading="lazy">
                    <figcaption></figcaption>

                </figure>
                 <figure class="roomPhotoItem">
                    <img
                    loading="lazy">
                    <figcaption></figcaption>

                </figure>
                <figure class="roomPhotoItem">
                    <img
                    loading="lazy">
                    <figcaption>Kukatpally, Hyderabad</figcaption>

                </figure>
                </div>
            </section>
          
        </section>

    </main>
     <footer id="footer" class="footerGrid"></footer>
     <script src="../assets/js/footer.js"></script>
     <script type="module" src="../assets/js/galleryRenderer.js"></script>

</body>
</html>
