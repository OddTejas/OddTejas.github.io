<body>
    <header>
             <a class="logoText" href="/" aria-label="OddHouse home">OddHouse</a>

    </header>
    <main>
        <section class="hero">
            <!--Hero must be outside of main section for proper margin alignment-->
           <img src="../assets/images/heroPhoto.webp" alt="Hero Image" id="heroImage" fetchpriority="high">
        </section>
        <section class="main">
            <section>
                 <h1 class="heroText">Place to admire, appreciate and showcase photos</h1>
                 <p>A notebook of photos over the span of half a decade. Watch me, who started no knowledge of this craft and a mobile; progess through and keep learning, keep experimenting and slowly learning my way.</p>
            </section>
            
            <section class="galleryRoom">
                <header class="roomHeader">
                    <p>Room 1 of 4</p>
                    <h2>Clouds</h2>
                </header>
                <figure class="mainPhoto">
                    <img src="../assets/images/may_20.png"
                    loading="lazy"
                    alt="cloudy express of Vijaywada-hyderabad national highway">
                    <figcaption>Vijaywada-hyderabad-expressway</figcaption>

                </figure>
                <figure class="secondary_photo">
                    <img src="../assets/images/hills_trip.webp"
                    loading="lazy"
                    alt="cloudy express of Vijaywada-hyderabad national highway">
                    <figcaption>Vijaywada-hyderabad-expressway</figcaption>

                </figure>
            </section>
          
        </section>

    </main>
     <footer id="footer" class="footerGrid"></footer>
     <script src="/assets/js/footer.js"></script>

</body>
